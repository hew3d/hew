# Open on Phone relay — proxies /relay/ to a local hew-relay process. Copied
# into /etc/nginx/hew.d/ (which nginx.conf includes) only when the relay is
# enabled; the web app is complete without it. Harmless if hew-relay is
# down: requests 502 and the desktop reports "could not reach".
#
# The trailing slash on proxy_pass strips the /relay/ prefix, so hew-relay
# sees /drop, /drop/<token>, and / — it accepts both spellings anyway.
# `location = /relay` catches the bare, slash-less identity URL that would
# otherwise fall into try_files and 404 as a missing static file.

location = /relay { return 308 /relay/; }

location /relay/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    # A hair over the relay's own 32 MiB per-drop cap, so the relay's typed
    # 413 (not nginx's bare one) is what an oversized upload gets.
    client_max_body_size 40m;
    # Stream the upload straight through: the relay enforces its caps from
    # the Content-Length header before reading, and buffering here would
    # spool every upload to disk first.
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # No add_header Cache-Control here: the relay sets `no-store` itself on
    # every cacheable answer, and adding it again would send the header
    # twice.
}
