# Canonical nginx server block for self-hosting the Hew web app.
#
# Hew is a static single-page app: no backend, no API, routing on
# window.location.hash rather than the path. This file is the single
# source of truth for the headers and behavior a host needs to get right
# — see docs/SELF_HOSTING.md for the full walkthrough. Docker deployments
# mount this same file rather than keeping a second copy.
#
# Edit the two `root` lines if you deploy somewhere other than /var/www/hew.
#
# `default_server`/`server_name _` assume this is the only site on port 80.
# Co-hosting alongside another site on the same host? Drop both, and give
# `server_name` this deployment's real hostname instead.
#
# nginx's `add_header` does not inherit into a location that sets its own
# `add_header` — it's all-or-nothing per level, not additive. So the two
# security headers below are repeated in every location that also sets
# Cache-Control, rather than declared once at the server level.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hew;
    index index.html;

    # The release tarball ships a branded 404.html at the tree root; without
    # this, a missing path still correctly 404s but renders nginx's bare
    # stock error page instead.
    error_page 404 /404.html;

    # The build's own <meta> CSP can't express frame-ancestors (clickjacking
    # protection) — only a real header can.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # No SPA history-fallback rewrite: Hew routes on the URL hash, not the
    # path, so every real path corresponds to a real file. Rewriting missing
    # paths to index.html would turn a stale/mistyped asset URL into an HTML
    # document served as if it were JavaScript.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite content-hashes everything under /assets/, so it's safe to cache
    # forever. index.html and the service worker are the update entry
    # points and must be revalidated on every load, or a client can get
    # stuck on a stale build.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # nginx's bundled mime.types has no entry for .webmanifest, so it falls
    # back to application/octet-stream — combined with X-Content-Type-Options
    # above, that's a real risk of the manifest being rejected instead of
    # merely mis-labeled.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
