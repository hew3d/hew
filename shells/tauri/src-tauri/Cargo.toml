[workspace]

[package]
name = "hew"
version = "1.4.0"
edition = "2021"
# edition 2024 is not yet supported by tauri-build; 2021 is current Tauri v2 default.
# Not a workspace member, so the license is stated directly (see LICENSE and
# LICENSE-EXCEPTION at the repo root).
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# The Hew Library's on-disk layout (docs/agents/HEW_API.md §8.1;
# docs/design/v1.1-cycle.md's Lane B): folder resolution, file naming, and
# atomic list/read/write/remove, shared with `hew-cli`'s own `hew.library.*`.
# A path dependency into the main cargo workspace at ../../../ (this crate
# is deliberately its own separate workspace — the root Cargo.toml's
# `exclude` comment explains why — but a path dependency needs no shared
# workspace, only a valid relative path). Pulls in only `crates/library`
# (+ its own `kernel`/`serde_json`/`sha2`), never the wasm boundary or
# anything UI-facing.
library = { path = "../../../crates/library" }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
# Second launches (Windows/Linux file-association double-clicks) must join the
# running instance: per-window-label autosave/recovery namespacing and
# window-state.json assume one process owns the config dir.
tauri-plugin-single-instance = "2"
# In-app auto-updater (see the `updater` feature below). Optional so
# package-manager builds can compile it out — they must own updates.
#
# Without the plugin's default `zip` feature: that feature only unpacks
# zipped Windows installers and gzipped AppImages, and Hew publishes neither
# (Windows updates are the raw -setup.exe, Linux the raw .AppImage; the
# macOS .app.tar.gz path does not depend on it). Leaving it on would compile
# in an older `zip` with open extraction advisories for code that never runs.
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-opener = "2.5.4"
# The "Open on Phone" relay client (src/relay_client.rs): four Rust
# commands bound to a Rust-held server setting replace what used to be
# `tauri-plugin-http` calls from the webview — no arbitrary-URL network
# capability exists in the webview at all, and TLS goes through the
# platform verifier so a homelab CA trusted in the OS keychain works. This
# is exactly the stack `tauri-plugin-updater` already uses (reqwest 0.13
# with `rustls-no-provider` + a crate-level `rustls` with the `ring`
# provider), so it adds no new crates to the build; the direct `rustls`
# dependency keeps exactly one crypto provider compiled in for
# `--no-default-features` (updater-less) builds too.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
# System font enumeration for the 3D Text font picker (docs/design/3d-text.md's
# font section) — pure Rust, MIT-licensed, no system font-library linking.
# Shell-crate-only dependency; kernel crates never gain new dependencies for
# this (DEVELOPMENT.md rule 1).
fontdb = "0.24.0"
# "Open on Phone" QR handoff (docs/design/shop-mode.md §4, qr.rs,
# workers/share-relay/README.md) — shell-crate-only, same rule as fontdb
# above. `qrcode` renders the cloud dead-drop's handoff URL to SVG, with
# only the `svg` feature on (no `image` raster backend needed). The upload
# itself, its token, and its encryption key are all handled in the webview
# (app/src/io/shareCrypto.ts) — this crate no longer needs its own random
# token generation for this feature, so the `getrandom` direct dependency
# that used to back it (LAN-server session tokens) is gone too.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# Windows named-pipe transport for `--live` (docs/agents/HEW_API.md §11.2):
# CreateNamedPipeW/ConnectNamedPipe/ReadFile/WriteFile, a per-user security
# descriptor (Win32_Security_Authorization), BCryptGenRandom for the
# discovery token, and OpenProcess for the stale-discovery-file sweep. All
# synchronous, mirroring the unix half's plain std::thread design — see
# src/live.rs's module doc for why windows-sys (not tokio, already
# transitively present via tauri/reqwest) was chosen. Target-gated so
# macOS/Linux builds gain nothing.
# System printing (src/print.rs, docs/design/printing.md §9): the platform
# print operation for the webview's DOM with Hew's own page geometry. All
# three stacks are already in the dependency tree through wry/tauri (same
# pinned versions); listing them here only makes their APIs callable from
# this crate. Shell-crate-only, like fontdb/qrcode above.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSObject", "NSURL", "NSDictionary", "NSValue", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSView", "NSResponder", "NSApplication", "NSMenu", "NSMenuItem", "NSScreen", "NSGraphics", "NSCursor", "NSSavePanel", "NSPanel", "NSPopUpButton", "NSButton", "NSControl", "NSTextField", "NSGridView", "NSCell", "NSLayoutConstraint"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
# The save panel's common item dialog (src/save_panel/windows.rs):
# IFileSaveDialog + IFileDialogCustomize + its event sink. Already in the
# tree through tauri/wry at this version; listing it makes the shell API
# callable from this crate.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
webview2-com = "0.38.2"
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    # The live API's overlapped named-pipe I/O (src/live.rs): `OVERLAPPED`,
    # `GetOverlappedResult`, `CancelIoEx`.
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
] }

[features]
# The in-app auto-updater: a check on launch plus a manual "Check for
# Updates" menu item, talking to the signed `latest.json` published on
# GitHub Releases. On by default, so the builds we ship directly (the
# notarized .dmg, the NSIS installer, the AppImage) can update themselves
# in place. Package-manager builds (Flathub, winget, AUR) own their own
# updates, so they build with `--no-default-features` and the updater —
# plugin, menu item, and launch check — compiles out entirely. The Homebrew
# cask is not one of them: it installs the notarized .dmg unchanged and
# declares `auto_updates`, leaving updates to this updater.
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
