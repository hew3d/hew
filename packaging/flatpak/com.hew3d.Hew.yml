# Flatpak manifest for Hew — repackages the released Linux .deb.
#
# Built by .github/workflows/packaging.yml into a self-hosted, GPG-signed
# repo under hew3d/hew-packages — not submitted to Flathub, which prefers
# open-source apps to build from source (that route needs a generated
# cargo-sources.json, node sources for the pnpm workspace, and vendored
# wasm-bindgen/wasm-opt so wasm-pack never touches the network — a
# separate effort, not needed for a self-hosted repo with no reviewer).
# See packaging/README.md.
#
# Rendered by packaging/scripts/render-templates.sh — edit that script, not
# the hashes here.
id: com.hew3d.Hew
runtime: org.gnome.Platform
# GNOME runtimes go EOL roughly a year after release (Flathub warns on
# install once they do) — bump this when that happens rather than
# leaving it to rot; check `flatpak remote-ls flathub | grep
# org.gnome.Platform` for what's current.
runtime-version: '50'
sdk: org.gnome.Sdk
command: hew
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The relay ("Open on Phone") and the update check.
  - --share=network
  # Models and the Library folder live wherever the user keeps them.
  - --filesystem=home
modules:
  - name: hew
    buildsystem: simple
    build-commands:
      - ar x hew.deb data.tar.gz
      - tar -xf data.tar.gz -C /app --strip-components=1 usr
      # Tell the app how it was installed (shells/tauri/src-tauri/src/
      # install_channel.rs): the .deb's binary carries the Deb marker, which
      # would otherwise send it to `dpkg`. Inside the sandbox the app updates
      # through `flatpak update`, never by installing a package itself.
      - mkdir -p /app/share/hew && printf 'flatpak\n' > /app/share/hew/install-channel
      - install -Dm644 com.hew3d.Hew.metainfo.xml /app/share/metainfo/com.hew3d.Hew.metainfo.xml
      # Flatpak wants the desktop entry and icons under the app id.
      - mv /app/share/applications/Hew.desktop /app/share/applications/com.hew3d.Hew.desktop
      - sed -i 's/^Icon=hew$/Icon=com.hew3d.Hew/' /app/share/applications/com.hew3d.Hew.desktop
      - for d in /app/share/icons/hicolor/*/apps; do mv "$d/hew.png" "$d/com.hew3d.Hew.png"; done
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/hew3d/hew/releases/download/v1.0.0/Hew_1.0.0_amd64.deb
        sha256: cfaeb57ccf93be1e27981d45adbecd187985de96b1a336576ef4364f5c874547
        dest-filename: hew.deb
      - type: file
        only-arches: [aarch64]
        url: https://github.com/hew3d/hew/releases/download/v1.0.0/Hew_1.0.0_arm64.deb
        sha256: c5645c047ad1f02e3612d949594551259abd43495aa435d234753f6493af191f
        dest-filename: hew.deb
      - type: file
        path: com.hew3d.Hew.metainfo.xml
