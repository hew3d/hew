# Hew desktop E2E — drives the REAL desktop binary (Tauri shell + WebKitGTK +
# WASM kernel) through WebdriverIO + tauri-driver, asserting the semantic
# harness round-trips a model. See shells/tauri/e2e/README.md.
#
# A SEPARATE workflow from the per-push CI pipeline, because it's heavy (a
# full desktop Rust build + the native WebKitWebDriver + Xvfb). It auto-runs
# only as a POST-MERGE gate on `main` — not on every PR, which would tax each
# push with a desktop build — plus manual workflow_dispatch (Actions tab ▸
# Desktop E2E ▸ Run workflow) to exercise a branch when a change warrants it.
#
# Because it does not run on pull requests, a Tauri dependency bump would
# otherwise automerge on a `verify` run that never launched the desktop
# binary. Tauri is therefore excluded from Renovate automerge and reviewed by
# hand (.github/renovate.json5).

name: Desktop E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # renovate: datasource=crates-io depName=tauri-driver
  TAURI_DRIVER_VERSION: '2.0.6'

  # The ONE place in this repository that does not take its Node from
  # `.node-version`, and the constraint is upstream's rather than ours.
  #
  # WebdriverIO's `webdriver` package imports `fetch` from its own bundled
  # undici — it pins `^6.27.0`, still true on the current 9.30.1 — but hands
  # that fetch `Headers` and `AbortSignal` objects built by Node's BUILT-IN
  # undici. The two copies have diverged far enough that undici 6 no longer
  # recognises undici 8.9's objects, so the session POST is rejected
  # client-side with UND_ERR_INVALID_ARG before a byte reaches tauri-driver.
  # Measured against a stub WebDriver endpoint, so the driver is not involved:
  #
  #   Node 24.19.0 (built-in undici 7.29.0)   session created
  #   Node 26.0.0  (built-in undici 8.0.2)    session created
  #   Node 26.7.0  (built-in undici 8.9.0)    UND_ERR_INVALID_ARG
  #
  # Every other lane — verify, the site build, Cloudflare Pages — passes on
  # 26.7.0, so pinning the whole repository back to 24 to suit one test
  # harness would be the tail wagging the dog. Renovate holds this to the 24
  # line; see the matching rule in .github/renovate.json5.
  #
  # DELETE this, and restore `node-version-file: .node-version` below, once
  # WebdriverIO stops mixing its own undici with Node's.
  # renovate: datasource=node-version depName=node
  NODE_VERSION: '24.19.0'

jobs:
  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System libs (Tauri + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            xvfb xauth

      # The native WebDriver tauri-driver delegates to. Both packages install
      # the same /usr/bin/WebKitWebDriver binary; the package was renamed
      # webkit2gtk-driver → webkitgtk-webdriver, so try the new name first
      # and fall back.
      - name: Install WebKitWebDriver
        run: |
          sudo apt-get install -y --no-install-recommends webkitgtk-webdriver \
            || sudo apt-get install -y --no-install-recommends webkit2gtk-driver
          command -v WebKitWebDriver

      # rustup honors rust-toolchain.toml — a PINNED version.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            shells/tauri/src-tauri

      # tauri-driver is a cargo-installed binary, which rust-cache does not
      # cover — cache it separately so warm runs skip the compile. The pinned
      # version is part of the key: without it, a version bump would restore
      # the previously compiled binary and the `command -v` guard below would
      # skip the install, silently keeping the old driver forever.
      - name: Cache tauri-driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Install tauri-driver (pinned)
        run: command -v tauri-driver || cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked

      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh

      # NOT .node-version — see the NODE_VERSION comment at the top of this file.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # pnpm's version comes from `packageManager` in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Ask pnpm where its store is rather than assuming — see ci.yml.
      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # wasm-pack build first: e2e:build's `tauri build` runs the app's vite
      # build, which imports the WASM pkg.
      - name: Build WASM kernel
        run: wasm-pack build crates/wasm-api --target web --out-dir ../../app/src/wasm/pkg

      # Harness-enabled debug binary (VITE_HEW_TEST=1 → window.__hew_test installs).
      - name: Build desktop binary (harness-enabled)
        run: pnpm --dir shells/tauri e2e:build

      # tauri-driver needs a display even headless; wrap the run in Xvfb.
      - name: Desktop E2E (tauri-driver, under Xvfb)
        run: xvfb-run -a pnpm --dir shells/tauri e2e
