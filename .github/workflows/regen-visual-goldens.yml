# Regen Visual Goldens — manually-triggered (Actions tab ▸ this workflow ▸
# "Run workflow"). Re-renders the visual-regression suite on the pinned
# configuration (ubuntu runner, 800×600 / DPR=1 / ANGLE-SwiftShader via
# Playwright's pinned Chromium) with --update-snapshots, then uploads the
# regenerated PNGs as a build artifact.
#
# The workflow deliberately does NOT commit: goldens are reviewed and
# committed by the maintainer. Download the `visual-goldens` artifact,
# unzip it over app/e2e/visual/ (it contains the *.spec.ts-snapshots/
# directories), inspect the diff, and commit.
#
# Run this when ci.yml's visual lane goes red on a change that MEANT to alter
# what the viewport renders — and, most often, on a Playwright bump, which
# brings a new pinned Chromium and so a new bundled SwiftShader. That lane
# blocks now, so such a PR waits: run this workflow against its branch, commit
# the PNGs onto that branch, and the PR goes green. A red visual lane on a
# change that did NOT intend to alter rendering is a regression, not a regen —
# read the diff before reaching for this.

name: Regen Visual Goldens

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup honors rust-toolchain.toml — a PINNED version.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm's version comes from `packageManager` in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Ask pnpm where its store is rather than assuming — see ci.yml.
      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The app dev server imports the wasm bindings from app/src/wasm/pkg;
      # Playwright's webServer boots vite, so the build must exist first.
      - name: Build kernel to WASM (web)
        run: wasm-pack build crates/wasm-api --target web --out-dir ../../app/src/wasm/pkg

      - name: Install Playwright Chromium
        run: pnpm --dir app exec playwright install --with-deps chromium

      - name: Regenerate goldens (visual project, --update-snapshots)
        env:
          CI: '1'
        run: pnpm --dir app run e2e:visual:update

      # Prove self-consistency: the suite must pass against the PNGs it just
      # wrote, or the regen itself is unstable and must not be committed.
      - name: Verify the fresh goldens pass
        env:
          CI: '1'
        run: pnpm --dir app run e2e:visual

      - name: Show which goldens changed
        run: git -C . status --short app/e2e/visual || true

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-goldens
          path: app/e2e/visual/*-snapshots
          if-no-files-found: error
