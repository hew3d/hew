# Hew CI — mirrors scripts/verify.sh (the canonical local gate: fmt +
# clippy -D warnings + cargo test + wasm-pack + Vitest + app build + the
# site build + the Tauri host crate's fmt/clippy), then adds the replay
# gate, the web-E2E smoke, and the visual goldens, and artifacts the built
# web app.
#
# Every toolchain here is pinned, and every action is pinned to a commit SHA;
# Renovate proposes the bumps (.github/renovate.json5). Nothing in this file
# should resolve to "whatever is newest" — that is how a clippy lint reached
# main that no developer machine could reproduce.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Tauri host crate's clippy pass needs the webkit2gtk/gtk stack;
      # the Playwright/WebGL smoke needs xvfb for the non-headless engines.
      - name: System libs (Tauri + WebGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            xvfb xauth

      # rustup honors rust-toolchain.toml — a PINNED version, so this runner
      # compiles with the exact toolchain a developer machine does.
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            shells/tauri/src-tauri

      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm's version comes from `packageManager` in the root package.json —
      # one source of truth that pnpm itself also honors locally. (Corepack,
      # which this step used to use, is no longer distributed with Node 25+.)
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          wasm-pack --version
          node --version
          pnpm --version

      # Ask pnpm where its store is rather than assuming: the path depends on
      # the OS and on how pnpm was installed, and a wrong guess yields a cache
      # that silently never hits.
      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (fmt, clippy, cargo test, wasm, vitest, builds)
        run: scripts/verify.sh

      # Replay gate — replay every committed recording into a fresh kernel
      # and assert its golden state_hash still matches. Needs a separate
      # wasm build: the runner consumes `--target nodejs` (CommonJS)
      # bindings, distinct from verify.sh's `--target web` app build.
      # NB: wasm-pack's --out-dir is relative to the crate dir.
      - name: Build kernel for Node (replay runner)
        run: wasm-pack build crates/wasm-api --target nodejs --out-dir ../../tools/replay-runner/pkg-node

      - name: Replay gate (golden state-hash fixtures)
        run: node tools/replay-runner/run.mjs

      - name: Install Playwright browsers
        run: pnpm --dir app exec playwright install --with-deps chromium webkit

      # Chromium (SwiftShader software GL): boot smoke, harness specs, and
      # the draw → push/pull → save/reload lifecycle.
      - name: Web E2E smoke (chromium)
        env:
          CI: '1'
        run: pnpm --dir app exec playwright test --project=chromium

      # WebKit (WebKitGTK) — the engine closest to the macOS WKWebView.
      # Runs under Xvfb because headless WebKitGTK needs a display + system
      # GL (llvmpipe) to bring up the WebGL2 viewport.
      #
      # Still non-blocking, deliberately, even though it has been green as
      # consistently as the visual lane. The visual lane is deterministic by
      # construction — pinned resolution, pinned DPR, and a software
      # rasterizer that ships inside Playwright. This one depends on the
      # runner image's WebKitGTK, its system GL (llvmpipe), and Xvfb, none of
      # which are pinned by anything in this repository, so a green history
      # is weaker evidence here than it is there. Promote it when its stack
      # is pinned, or when a failure it catches justifies the flake risk.
      - name: Web E2E smoke (webkit) [validating — non-blocking]
        continue-on-error: true
        env:
          CI: '1'
        run: xvfb-run -a pnpm --dir app exec playwright test --project=webkit

      # Visual-regression goldens on the pinned `visual` project (fixed
      # 800×600 / DPR=1 / SwiftShader). The renderer is ANGLE-SwiftShader
      # bundled with Playwright's pinned Chromium, so output is reproducible
      # across hosts on the same @playwright/test version.
      #
      # BLOCKING. It spent its validation period non-blocking and came back
      # green on every run that reached it — including the one that carried
      # three.js 0.184 -> 0.185 and Playwright 1.61 -> 1.62 together, which
      # replaced both the renderer and the bundled SwiftShader at once. That
      # is the pair most likely to shift pixels, and it did not.
      #
      # Making it required is what lets three.js and Playwright automerge
      # (.github/renovate.json5): until now nothing could fail a build on a
      # renderer regression, so those two needed a person. A legitimate shift
      # — usually a Playwright bump bringing a new Chromium — now turns the
      # PR red rather than landing unnoticed, and the fix is to regenerate:
      # Actions ▸ Regen Visual Goldens ▸ Run workflow (it takes a branch),
      # then commit the PNGs it produces onto that branch.
      - name: Web E2E visual goldens
        env:
          CI: '1'
        run: pnpm --dir app exec playwright test --project=visual

      - name: Upload built web app
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: app/dist
          if-no-files-found: warn

      - name: Upload built site
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: warn

      - name: Upload Playwright report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
