# Hew CI — runs scripts/verify.sh (the canonical local gate: fmt +
# clippy -D warnings + cargo test + wasm-pack + Vitest + app build + the
# site build + the Tauri host crate's fmt/clippy) as parallel lanes, then
# adds the replay gate, the web-E2E smoke (sharded), and the visual goldens.
# A separate job holds the "Open on Phone" relay to its contract
# (scripts/relay-contract.sh) on both implementations.
#
# Shape: one `wasm` job builds the kernel once, WITHOUT wasm-opt (about 7 of
# every 9 minutes of a wasm-pack build is wasm-opt, and nothing that tests
# the kernel needs it: E2E runs the vite dev server and the replay gate
# checks state hashes). Everything that needs the kernel downloads that
# artifact. The size-optimized build that actually ships is built once, in
# parallel and off the critical path (`wasm-release`), so a wasm-opt failure
# still turns a PR red; deploy-beta reuses that artifact.
#
# Every toolchain here is pinned, and every action is pinned to a commit SHA;
# Renovate proposes the bumps (.github/renovate.json5). Nothing in this file
# should resolve to "whatever is newest" — that is how a clippy lint reached
# main that no developer machine could reproduce.

name: CI

on:
  push:
    branches: [main, feature/plugin-system]
  pull_request:

# A new push to a PR supersedes the old one. Pushes to main are never
# cancelled (every commit keeps its own signal, and deploy-beta carries its
# own group): their group key is the unique run id.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The kernel, built once for the test lanes. --no-opt skips wasm-opt (see
  # the header). Both wasm-pack targets compile the same cargo artifact, so
  # the second build is bindgen only. Both packages are gitignored build
  # outputs; they travel between jobs as artifacts.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh

      # NB: wasm-pack's --out-dir is relative to the crate dir.
      - name: Build kernel (web target, no wasm-opt)
        run: wasm-pack build crates/wasm-api --target web --no-opt --out-dir ../../app/src/wasm/pkg

      - name: Build kernel (Node target, no wasm-opt)
        run: wasm-pack build crates/wasm-api --target nodejs --no-opt --out-dir ../../tools/replay-runner/pkg-node

      - name: Upload kernel (web)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-web
          path: app/src/wasm/pkg
          if-no-files-found: error

      - name: Upload kernel (Node)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-node
          path: tools/replay-runner/pkg-node
          if-no-files-found: error

  # Rust: packaging tests, fmt, clippy -D warnings, cargo test.
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rust gate
        run: scripts/verify.sh rust

  # Web app: typecheck, lint, i18n, Vitest, app + site builds. The app build
  # reuses the downloaded kernel package.
  web:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js
      # Downloaded after checkout, so the files are NEWER than the sources;
      # touch them anyway because app/scripts/build-wasm.mjs rebuilds the
      # kernel when any Rust source is newer than the package, and an
      # artifact can restore its original (older) mtimes.
      - name: Download kernel (WASM, web target)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-web
          path: app/src/wasm/pkg
      - name: Freshen kernel package mtimes
        run: find app/src/wasm/pkg -type f -exec touch {} +
      - name: Web gate
        env:
          # This lane builds against the unoptimized test kernel; see the
          # precache ceiling in app/vite.config.ts.
          HEW_UNOPTIMIZED_WASM: '1'
        run: scripts/verify.sh web

      - name: Upload built web app
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: app/dist
          if-no-files-found: warn

      - name: Upload built site
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: warn

  # Tauri host crate fmt + clippy. tauri's generate_context! reads app/dist
  # at compile time, so this needs the web build's output.
  tauri:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Tauri host crate's clippy pass needs the webkit2gtk/gtk stack.
      - name: System libs (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            shells/tauri/src-tauri

      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js
      - name: Download built web app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: app/dist

      - name: Tauri host gate
        run: scripts/verify.sh tauri

  # Replay gate — replay every committed recording into a fresh kernel and
  # assert its golden state_hash still matches. Consumes the `--target
  # nodejs` (CommonJS) bindings built by the `wasm` job.
  replay:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download kernel (WASM, Node target)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-node
          path: tools/replay-runner/pkg-node

      - name: Replay gate (golden state-hash fixtures)
        run: node tools/replay-runner/run.mjs

  # Chromium (SwiftShader software GL): boot smoke, harness specs, and the
  # draw -> push/pull -> save/reload lifecycle. Sharded across runners:
  # playwright.config.ts pins workers: 1 because SwiftShader is CPU-bound
  # and parallel workers on ONE machine contend; separate runners do not.
  # fullyParallel is off, so a shard is a set of whole spec files.
  e2e-chromium:
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js
      # Downloaded after checkout, so the files are NEWER than the sources;
      # touch them anyway because app/scripts/build-wasm.mjs rebuilds the
      # kernel when any Rust source is newer than the package, and an
      # artifact can restore its original (older) mtimes.
      - name: Download kernel (WASM, web target)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-web
          path: app/src/wasm/pkg
      - name: Freshen kernel package mtimes
        run: find app/src/wasm/pkg -type f -exec touch {} +
      - name: Install Playwright browsers
        run: pnpm --dir app exec playwright install --with-deps chromium

      - name: Web E2E smoke (chromium, shard ${{ matrix.shard }}/4)
        env:
          CI: '1'
        run: pnpm --dir app exec playwright test --project=chromium --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: app/playwright-report
          if-no-files-found: ignore

  # Visual-regression goldens on the pinned `visual` project (fixed 800x600 /
  # DPR=1 / SwiftShader). The renderer is ANGLE-SwiftShader bundled with
  # Playwright's pinned Chromium, so output is reproducible across hosts on
  # the same @playwright/test version. Not sharded: it is a handful of
  # tests.
  #
  # BLOCKING. It spent its validation period non-blocking and came back
  # green on every run that reached it — including the one that carried
  # three.js 0.184 -> 0.185 and Playwright 1.61 -> 1.62 together, which
  # replaced both the renderer and the bundled SwiftShader at once. That
  # is the pair most likely to shift pixels, and it did not.
  #
  # Making it required is what lets three.js and Playwright automerge
  # (.github/renovate.json5): until now nothing could fail a build on a
  # renderer regression, so those two needed a person. A legitimate shift
  # — usually a Playwright bump bringing a new Chromium — now turns the
  # PR red rather than landing unnoticed, and the fix is to regenerate:
  # Actions > Regen Visual Goldens > Run workflow (it takes a branch),
  # then commit the PNGs it produces onto that branch.
  e2e-visual:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js
      # Downloaded after checkout, so the files are NEWER than the sources;
      # touch them anyway because app/scripts/build-wasm.mjs rebuilds the
      # kernel when any Rust source is newer than the package, and an
      # artifact can restore its original (older) mtimes.
      - name: Download kernel (WASM, web target)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-web
          path: app/src/wasm/pkg
      - name: Freshen kernel package mtimes
        run: find app/src/wasm/pkg -type f -exec touch {} +
      - name: Install Playwright browsers
        run: pnpm --dir app exec playwright install --with-deps chromium

      - name: Web E2E visual goldens
        env:
          CI: '1'
        run: pnpm --dir app exec playwright test --project=visual

      - name: Upload Playwright report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-visual
          path: app/playwright-report
          if-no-files-found: ignore

  # WebKit (WebKitGTK) — the engine closest to the macOS WKWebView. Runs
  # under Xvfb because headless WebKitGTK needs a display + system GL
  # (llvmpipe) to bring up the WebGL2 viewport.
  #
  # NON-BLOCKING, and it is NOT green: a recent run had dozens of failures
  # (and ~70 minutes of retries) that the step-level continue-on-error hid.
  # It depends on the runner image's WebKitGTK, its system GL, and Xvfb,
  # none of which this repository pins. It is its own job so it never sits
  # on the critical path, and nothing `needs` it (deploy-beta included).
  # continue-on-error stays on the STEP, not the job: the job then reports
  # success, which is what keeps Renovate's automerge-on-green working.
  # Triage the failures before promoting it.
  e2e-webkit:
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libs (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js
      # Downloaded after checkout, so the files are NEWER than the sources;
      # touch them anyway because app/scripts/build-wasm.mjs rebuilds the
      # kernel when any Rust source is newer than the package, and an
      # artifact can restore its original (older) mtimes.
      - name: Download kernel (WASM, web target)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-web
          path: app/src/wasm/pkg
      - name: Freshen kernel package mtimes
        run: find app/src/wasm/pkg -type f -exec touch {} +
      - name: Install Playwright browsers
        run: pnpm --dir app exec playwright install --with-deps webkit

      - name: Web E2E smoke (webkit, shard ${{ matrix.shard }}/4) [validating — non-blocking]
        continue-on-error: true
        env:
          CI: '1'
        run: xvfb-run -a pnpm --dir app exec playwright test --project=webkit --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: app/playwright-report
          if-no-files-found: ignore

  # The relay contract, on both implementations (scripts/relay-contract.sh —
  # the same script scripts/verify-full.sh runs): the share-relay Worker's
  # unit suite (never wired into CI before this), then the black-box
  # conformance suite in workers/share-relay/contract/ against the Worker
  # under `wrangler dev --local` (open, and with an upload key) and against
  # the self-hostable hew-relay binary (defaults, upload key, and a short-TTL
  # / tiny-cap run for the expiry and relay-full cases). BLOCKING: the
  # desktop, the phone app, and every self-hoster depend on the two servers
  # answering identically.
  relay-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # wrangler comes from workers/share-relay's own package-lock (that
      # directory is deliberately outside the pnpm workspace); the script
      # runs `npm ci` itself when the binary is missing.
      - name: Relay contract (unit + conformance on Worker and hew-relay)
        env:
          CI: '1'
        run: scripts/relay-contract.sh

  # bug-intake's unit suite (node --test, zero deps at test time) — the
  # private Report Bug intake service beside share-relay. Unlike the relay,
  # there is no second implementation of its contract to conform against,
  # so there is no black-box suite/script here, just the unit tests.
  bug-intake-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: bug-intake unit suite
        run: |
          cd workers/bug-intake
          npm test

  # The size-optimized kernel that actually ships (wasm-opt on). Built on
  # every run, in parallel with the test lanes, so a wasm-opt or release-
  # profile failure surfaces on the PR rather than after merge, and so
  # deploy-beta finds it ready instead of spending ~7 minutes on it after
  # everything is green.
  wasm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh

      - name: Build kernel (web target, optimized)
        run: wasm-pack build crates/wasm-api --target web --out-dir ../../app/src/wasm/pkg

      - name: Upload optimized kernel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-web-release
          path: app/src/wasm/pkg
          if-no-files-found: error

  # beta.hew3d.com — the pre-release copy of main for testers. Every push to
  # main that passes the WHOLE workflow is deployed here, so testers see
  # fixes and features before the next tagged release reaches app.hew3d.com.
  #
  # It needs all three gates (verify, relay-contract, bug-intake-tests):
  # "main is green" means the entire workflow, not just the app lane, and a
  # broken relay or intake service is not something to hand to testers.
  #
  # `--branch=main` matters: the Pages project's production branch is main,
  # and the production deployment is what the custom domain serves. Any
  # other branch name would publish a preview URL and leave beta.hew3d.com
  # unchanged. cancel-in-progress only trims the queue; runs for different
  # pushes finish in any order and an old run can be re-run. The tip check
  # (compare GITHUB_SHA with the live main) is what guarantees the newest
  # commit wins, including re-runs of old runs.
  #
  # The deploy self-skips when the Cloudflare secrets are absent, which is
  # the case on forks and on clones that have not configured them; the guard
  # on `github.repository` keeps forks from running the job at all. This is
  # separate from the production deploy: release.yml's `web` job still
  # publishes app.hew3d.com at tag time and is unaffected.
  deploy-beta:
    needs: [wasm, rust, web, tauri, replay, e2e-chromium, e2e-visual, relay-contract, bug-intake-tests, wasm-release]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'hew3d/hew'
    concurrency:
      group: deploy-beta
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js

      # The size-optimized kernel built in parallel by `wasm-release`. Freshen
      # the mtimes so app/scripts/build-wasm.mjs sees it as newer than the
      # sources and does not rebuild it (a wasm-pack build is ~7 minutes,
      # almost all of it wasm-opt).
      - name: Download optimized kernel (WASM)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-web-release
          path: app/src/wasm/pkg
      - name: Freshen kernel package mtimes
        run: find app/src/wasm/pkg -type f -exec touch {} +

      # Freshness guard. Skip a stale run before spending minutes building it.
      - name: Skip if main has moved on
        run: |
          tip="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main; refusing to deploy blind."
            exit 1
          fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on ($GITHUB_SHA is not the tip $tip); skipping the beta deploy."
            echo "STALE=1" >> "$GITHUB_ENV"
          fi

      # app build + CSP <meta> injection. HEW_BETA_SHA stamps the version as
      # `<version>+beta.<sha>` so testers can quote exactly which build they
      # ran. The `${GITHUB_SHA::8}` is bash parameter expansion, evaluated by
      # the shell at run time, not by the workflow expression parser.
      - name: Build web shell (beta stamp)
        if: env.STALE != '1'
        run: |
          HEW_BETA_SHA="${GITHUB_SHA::8}" pnpm --dir shells/web build

      # A separate, complete headers file (not an append to the production
      # one) so everything beta serves is reviewable in one place.
      - name: Install beta headers
        if: env.STALE != '1'
        run: cp shells/web/_headers.beta shells/web/dist/_headers

      - name: Deploy beta.hew3d.com (Cloudflare Pages)
        if: env.STALE != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set — skipping the beta.hew3d.com deploy."
            exit 0
          fi
          # Re-check right before the upload to close the window since the
          # early check.
          tip="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main; refusing to deploy blind."
            exit 1
          fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on ($GITHUB_SHA is not the tip $tip); skipping the beta deploy."
            exit 0
          fi
          # The default shell has no pipefail; without it a failed deploy
          # would be masked by tee's exit status.
          set -o pipefail
          npx wrangler@4 pages deploy shells/web/dist \
            --project-name=hew-app-beta --branch=main --commit-dirty=true \
            2>&1 | tee wrangler.log
          version="$(node -p "require('./app/package.json').version")+beta.${GITHUB_SHA::8}"
          url="$(grep -Eo 'https://[^ ]+' wrangler.log | tail -n 1 || true)"
          echo "::notice::Deployed beta $version to ${url:-an unknown URL (wrangler printed none)}."
