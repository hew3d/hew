# Nightly WebKit run of the web E2E suite.
#
# WebKit (WebKitGTK) is the engine closest to the macOS WKWebView. It runs
# under Xvfb because headless WebKitGTK needs a display + system GL
# (llvmpipe) to bring up the WebGL2 viewport.
#
# It is NON-BLOCKING, and it is NOT green: a recent run had dozens of
# failures (and ~70 minutes of retries). It depends on the runner image's
# WebKitGTK, its system GL, and Xvfb, none of which this repository pins.
# Nothing waits on its result, so it does not run on every push: four
# runners for over an hour bought no signal a push could act on. Nightly, a
# regression still shows up the next morning. Triage the failures before
# promoting it back to CI.
#
# continue-on-error stays on the test STEP, so read the step, not the job:
# the job reports success either way.
#
# Every action is pinned to a commit SHA, as in ci.yml.

name: E2E WebKit

on:
  schedule:
    # 09:00 UTC daily, ahead of the 11:00 fuzz run.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  # The preview kernel, built once for the four shards, without wasm-opt
  # (see ci.yml's header).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh
      - name: Build kernel, preview flavor (web, no wasm-opt)
        run: scripts/wasm-flavors.sh build preview web --no-opt
      - name: Upload kernel flavor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-flavors
          path: target/wasm-flavors
          if-no-files-found: error

  e2e-webkit:
    needs: wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libs (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Set up JS toolchain
        uses: ./.github/actions/setup-js
      # The run uses the preview build (the Vite dev server, flag on), so it
      # takes the preview kernel.
      - name: Download kernel flavors (WASM)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-flavors
          path: target/wasm-flavors
      - name: Select the preview kernel
        run: scripts/wasm-flavors.sh use preview
      - name: Install Playwright browsers
        run: pnpm --dir app exec playwright install --with-deps webkit

      - name: Web E2E smoke (webkit, shard ${{ matrix.shard }}/4) [validating — non-blocking]
        continue-on-error: true
        env:
          CI: '1'
          HEW_PREVIEW: '1'
        run: xvfb-run -a pnpm --dir app exec playwright test --project=webkit --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit-${{ matrix.shard }}
          path: app/playwright-report
          if-no-files-found: ignore
