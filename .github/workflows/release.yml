# Hew release — tag push `v*` → one DRAFT GitHub Release carrying the full
# installer matrix (see docs/RELEASE_PLANNING in the planning tree, RR8):
#
#   macOS      universal .dmg (+ .app.tar.gz updater bundle)
#   Windows    NSIS -setup.exe, x64 + arm64
#   Linux      AppImage + .deb + .rpm, x64 + arm64 (built on ubuntu-22.04 for
#              the glibc floor — O3)
#   hew-cli    bundled as a sidecar (Tauri externalBin) inside every one of
#              the above — Contents/MacOS/ on macOS, next to hew.exe on
#              Windows, /usr/bin/hew-cli on Linux .deb/.rpm (on PATH), and
#              inside the AppImage (not independently runnable there without
#              --appimage-extract; the .deb/.rpm are what puts it on PATH)
#   Web        hew-web-vX.Y.Z.tar.gz self-hosting tarball (the built app plus
#              a deploy/ directory: nginx.conf, the relay proxy stanza, the
#              relay systemd unit — so a deployment is version-locked to the
#              app it ships) + Cloudflare Pages deploy of app.hew3d.com
#              (skipped loudly until the Cloudflare secrets exist)
#   Relay      hew-relay-vX.Y.Z-linux-{x86_64,aarch64}.tar.gz — the
#              self-hostable "Open on Phone" relay (static musl binary +
#              systemd unit + README), built natively on the x64 and arm64
#              runners; plus a multi-arch ghcr.io/<owner>/hew-relay image
#   Updater    latest.json assembled from the per-platform .sig assets by a
#              final job (NOT tauri-action's per-job merge, which loses
#              updates when parallel matrix jobs race the read-modify-write)
#   Notes      the release body gets a platform × architecture download
#              table once all assets exist; it never overwrites a body that
#              already carries one, so hand-edited draft notes survive
#              re-runs
#
# Releases stay DRAFTS. Publishing is a deliberate human act after smoke
# installs.
#
# Signing posture: the updater artifacts are minisign-signed via
# TAURI_SIGNING_PRIVATE_KEY (independent of OS code signing). OS signing
# (Apple notarization, SignPath) is added later by supplying the documented
# secrets — macOS builds are ad-hoc signed and Windows installers unsigned
# until then, which draft smoke tests must expect (right-click-open /
# SmartScreen "More info").
#
# The tagged commit is assumed CI-green — this workflow builds and bundles;
# it does not re-run the verify gate.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # The relay-image job pushes ghcr.io/<owner>/hew-relay with GITHUB_TOKEN.
  packages: write

env:
  # Version = tag minus the leading `v`; stamped into the bundle via a
  # generated Tauri --config overlay so the in-tree 0.1.0 stays untouched
  # during the v0.0.x test-tag window.
  TAG: ${{ github.ref_name }}
  # wasm-opt for the Windows-on-ARM bundle (see the desktop job). binaryen
  # tags releases `version_NNN`, not semver, so Renovate needs the versioning
  # override to compare them.
  # renovate: datasource=github-releases depName=WebAssembly/binaryen versioning=regex:^version_(?<major>\d+)$
  BINARYEN_VERSION: 'version_130'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Parse and guard the tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH — refusing to release."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="Hew $TAG" \
            -f body="Build in progress — the download table is added when all artifacts have been uploaded." \
            -F draft=true \
            --jq '.id')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
          - name: windows-arm64
            os: windows-11-arm
            args: --bundles nsis
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same stack ci.yml installs for the Tauri host crate, plus xdg-utils:
      # the AppImage bundler embeds /usr/bin/xdg-open, which the arm64 runner
      # image (unlike x64) does not preinstall. squashfs-tools serves the
      # libwayland strip-and-repack step below.
      - name: System libs (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            xdg-utils squashfs-tools

      # rustup honors rust-toolchain.toml — a PINNED version, so a release is
      # built with the same compiler CI verified the commit with. The
      # universal build additionally needs both macOS targets up front.
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            shells/tauri/src-tauri

      # scripts/install-wasm-pack.sh owns both the pinned version and the
      # per-platform choice: prebuilt tarball on Unix, `cargo install` on
      # Windows (upstream publishes no aarch64-pc-windows-msvc build, and this
      # matrix has a windows-arm64 leg). That Windows compile is slow, so the
      # exe is cached the way desktop-e2e.yml caches tauri-driver — keyed on
      # the installer script's contents, so a version bump invalidates the
      # cache instead of restoring the old binary past its `command -v` guard.
      - name: Cache wasm-pack (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack.exe
          key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-wasm-pack.sh') }}

      - name: Install wasm-pack (pinned)
        shell: bash
        run: scripts/install-wasm-pack.sh

      # wasm-pack has no prebuilt wasm-opt for Windows-on-ARM and hard-fails
      # there; it looks for wasm-opt on PATH before downloading, so supply
      # binaryen's native arm64 build instead of shipping an unoptimized
      # kernel in that installer.
      #
      # binaryen tags releases `version_NNN` rather than semver, hence the
      # `versioning=` override; the tag string is used verbatim in the URL, the
      # archive name, and the directory it unpacks to.
      - name: Install wasm-opt (Windows arm64)
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\binaryen.tar.gz" `
            "https://github.com/WebAssembly/binaryen/releases/download/${env:BINARYEN_VERSION}/binaryen-${env:BINARYEN_VERSION}-arm64-windows.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\binaryen.tar.gz" -C $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\binaryen-${env:BINARYEN_VERSION}\bin"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm's version comes from `packageManager` in the root package.json —
      # one source of truth that pnpm itself also honors locally. (Corepack,
      # which this step used to use, is no longer distributed with Node 25+.)
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Ask pnpm where its store is rather than listing one path per OS: the
      # answer depends on the platform AND on how pnpm was installed, and a
      # wrong guess yields a cache that silently never hits.
      - name: Locate pnpm store
        shell: bash
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install JS dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # The overlay also switches on updater-artifact creation (.app.tar.gz /
      # .sig files). That flag lives HERE, not in tauri.conf.json, on purpose:
      # with it in the base config, a keyless local `pnpm --dir shells/tauri
      # build` would fail demanding TAURI_SIGNING_PRIVATE_KEY.
      - name: Stamp release version
        shell: bash
        run: |
          printf '{"version": "%s", "bundle": {"createUpdaterArtifacts": true}}\n' \
            "${TAG#v}" > release-version.json

      # Apple code signing + notarization (RR9). Exported through GITHUB_ENV
      # only when the secrets exist: `env:` on a step always materializes
      # unset secrets as empty strings, and an empty APPLE_SIGNING_IDENTITY
      # would send codesign chasing an identity named "" instead of falling
      # back to ad-hoc signing. With no secrets set, this step is a no-op and
      # the macOS build stays ad-hoc signed (the pre-RR9 posture). tauri-action
      # imports the .p12 into a throwaway keychain; notarization (and
      # stapling) engage only when the App Store Connect API-key trio exists.
      - name: Stage Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE<<__EOF__";          echo "$CERT";          echo "__EOF__"
              echo "APPLE_CERTIFICATE_PASSWORD<<__EOF__"; echo "$CERT_PASSWORD"; echo "__EOF__"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "::notice::Apple code signing enabled."
          else
            echo "::notice::APPLE_CERTIFICATE not set — macOS build will be ad-hoc signed."
          fi
          if [ -n "$API_KEY_CONTENT" ]; then
            printf '%s\n' "$API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
            {
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            } >> "$GITHUB_ENV"
            echo "::notice::Notarization enabled."
          else
            echo "::notice::App Store Connect API key not set — skipping notarization."
          fi

      # hew-cli ships as a bundled sidecar (bundle.externalBin in
      # tauri.conf.json), which tauri-action's `tauri build` below resolves
      # by looking for binaries/hew-cli-<target-triple>[.exe] on disk — it
      # doesn't build hew-cli itself. tauri-action invokes the Tauri CLI
      # directly (tauriScript: pnpm tauri), bypassing package.json's `build`
      # script and the staging it chains in, so this has to happen here
      # explicitly rather than relying on that.
      #
      # macOS builds --target universal-apple-darwin, which tauri-cli
      # implements as TWO separate single-arch `cargo build` passes (each
      # with its own build.rs run, resolving externalBin against ITS OWN
      # triple) followed by `lipo` on the app's own main binary only —
      # tauri-cli never lipos externalBin sidecars for you. So three files
      # are needed simultaneously: the two single-arch binaries (each
      # single-arch build.rs invocation looks for its own) and a
      # pre-lipo'd universal one (what the final bundling pass actually
      # reads for the sidecar, per crates/tauri-bundler's own separate,
      # non-arch-specific resolution against the literal target string
      # "universal-apple-darwin"). Source-verified against tauri-cli
      # 2.11.2: crates/tauri-cli/src/interface/rust/desktop.rs's universal
      # build path lipos only `bin_name` (the main binary); the sidecar
      # path is resolved independently in crates/tauri-bundler's
      # SettingsBuilder against the un-split "universal-apple-darwin"
      # target string, with no merge step of its own. Windows/Linux build
      # for the runner's native target with no --target flag, so the
      # plain staging script (host-triple only) is exactly right there.
      - name: Stage hew-cli sidecar (macOS universal)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release -p hew-cli --target x86_64-apple-darwin
          cargo build --release -p hew-cli --target aarch64-apple-darwin
          mkdir -p shells/tauri/src-tauri/binaries
          cp target/x86_64-apple-darwin/release/hew-cli shells/tauri/src-tauri/binaries/hew-cli-x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/hew-cli shells/tauri/src-tauri/binaries/hew-cli-aarch64-apple-darwin
          lipo -create -output shells/tauri/src-tauri/binaries/hew-cli-universal-apple-darwin \
            target/x86_64-apple-darwin/release/hew-cli \
            target/aarch64-apple-darwin/release/hew-cli

      - name: Stage hew-cli sidecar
        if: runner.os != 'macOS'
        shell: bash
        run: node shells/tauri/scripts/stage-cli-sidecar.mjs

      # tauri-action runs beforeBuildCommand (app build, which builds the
      # WASM kernel via build-wasm.mjs), bundles, and uploads the artifacts
      # plus their .sig files to the draft release. The updater JSON stays
      # OFF — the updater-manifest job assembles latest.json race-free.
      #
      # That input was `includeUpdaterJson` until tauri-action v1 renamed it
      # to `uploadUpdaterJson`. The rename matters: an unknown input is only a
      # WARNING to Actions, so carrying the old name across the major would
      # have left the new one at its default of `true` and put every matrix
      # job back to uploading its own latest.json — the exact race the
      # updater-manifest job exists to prevent, and one that would only have
      # shown up in a real release.
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: shells/tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          # Without this, tauri-action falls back to `npm run tauri`, which
          # doesn't exist here — the CLI is a pnpm-managed devDependency.
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config ${{ github.workspace }}/release-version.json

      # The bundler sweeps the build distro's libwayland into the AppImage
      # as a GTK dependency, and that stale copy breaks EGL display creation
      # against newer hosts' graphics stacks — white window, "Could not
      # create default EGL display: EGL_BAD_PARAMETER" (upstream:
      # tauri-apps/tauri#11994; fix verified on a machine hitting it). The
      # host's libwayland is always the right one, so: strip the bundled
      # copies, repack around the AppImage's own runtime (no third-party
      # repack tooling enters the release path), re-sign, and replace the
      # asset pair tauri-action uploaded. Runs before updater-manifest, so
      # latest.json picks up the replacement signature.
      - name: Strip bundled libwayland from the AppImage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundles=(shells/tauri/src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#bundles[@]}" -eq 1 ] || {
            echo "::error::Expected exactly one AppImage, found: ${bundles[*]:-none}" >&2
            exit 1
          }
          app="$(realpath "${bundles[0]}")"

          workdir="$(mktemp -d)"
          (cd "$workdir" && "$app" --appimage-extract > /dev/null)

          # Locate by search, not a fixed path — an arm64 or future-bundler
          # layout must not dodge the strip. Finding none is a hard failure:
          # until the upstream bundler is confirmed fixed, "nothing to strip"
          # means this step is no longer looking in the right place, and a
          # loud release failure beats quietly shipping a broken AppImage.
          # (When tauri stops bundling libwayland for real, delete this step.)
          mapfile -t bundled < <(find "$workdir/squashfs-root" -name 'libwayland-*.so*')
          if [ "${#bundled[@]}" -eq 0 ]; then
            echo "::error::No bundled libwayland found in the AppImage — the strip step no longer matches the bundle layout." >&2
            exit 1
          fi
          rm -v "${bundled[@]}"

          # The squashfs offset doubles as the runtime's byte length. The
          # runtime binary answers it directly; the python fallback reads it
          # from the ELF header (end of the section-header table), verified
          # byte-identical against a real bundle.
          offset="$("$app" --appimage-offset 2>/dev/null)" || offset="$(python3 - "$app" <<'PY'
          import struct, sys
          with open(sys.argv[1], 'rb') as f:
              hdr = f.read(64)
          e_shoff, = struct.unpack_from('<Q', hdr, 0x28)
          e_shentsize, e_shnum = struct.unpack_from('<HH', hdr, 0x3A)
          print(e_shoff + e_shentsize * e_shnum)
          PY
          )"
          head -c "$offset" "$app" > "$workdir/runtime"
          python3 -c "import sys
          with open(sys.argv[1], 'rb') as f:
              f.seek(int(sys.argv[2]))
              assert f.read(4) == b'hsqs', 'offset does not land on a squashfs superblock'
          " "$app" "$offset"

          # Same compression and block size the bundler used (zstd/128K), so
          # the retained runtime is guaranteed to read the new image.
          mksquashfs "$workdir/squashfs-root" "$workdir/filesystem.squashfs" \
            -noappend -all-root -comp zstd -b 131072 > /dev/null
          cat "$workdir/runtime" "$workdir/filesystem.squashfs" > "$app"
          chmod +x "$app"

          # Prove the surgery: the repacked image must extract, keep AppRun,
          # and carry no libwayland.
          rm -rf "$workdir/squashfs-root"
          (cd "$workdir" && "$app" --appimage-extract > /dev/null)
          if [ -n "$(find "$workdir/squashfs-root" -name 'libwayland-*.so*' -print -quit)" ]; then
            echo "::error::libwayland survived the repack." >&2
            exit 1
          fi
          [ -e "$workdir/squashfs-root/AppRun" ] || {
            echo "::error::Repacked AppImage lost AppRun." >&2
            exit 1
          }

          # Drop tauri-action's signature first so the size guard below can
          # only ever be satisfied by the fresh one.
          rm -f "$app.sig"
          pnpm --dir shells/tauri exec tauri signer sign "$app"
          [ -s "$app.sig" ] || {
            echo "::error::Re-signing produced no signature." >&2
            exit 1
          }

          # Replace the asset pair under the same names, so every download
          # link and latest.json URL stays valid.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.name, .id] | @tsv' > "$workdir/assets.tsv"
          for f in "$app" "$app.sig"; do
            n="$(basename "$f")"
            id="$(awk -F'\t' -v n="$n" '$1 == n {print $2}' "$workdir/assets.tsv")"
            [ -z "$id" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$n" \
              --input "$f" > /dev/null
            echo "Replaced release asset $n"
          done

  web:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install wasm-pack (pinned)
        run: scripts/install-wasm-pack.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm's version comes from `packageManager` in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Ask pnpm where its store is rather than assuming — see the desktop job.
      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-X64-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-X64-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # app build + CSP <meta> injection (shells/web/inject-csp.mjs).
      - name: Build web shell
        run: pnpm --dir shells/web build

      # The self-hosting artifact: "unzip behind any static file server".
      # Deliberately excludes the Cloudflare-specific _headers file. Carries
      # shells/web/deploy/ as a top-level deploy/ (nginx.conf, hew.d/relay.conf,
      # hew-relay.service) so an installation takes its configs from the
      # release it is running, not from whatever `main` says today.
      - name: Pack and upload self-hosting tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          tar -czf "hew-web-$TAG.tar.gz" -C shells/web/dist . -C ../ deploy
          # Idempotent: GitHub 422s on duplicate asset names, so a re-run of
          # this job (e.g. to fire the Cloudflare deploy after the secrets
          # appear) must first drop the asset it uploaded last time.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select(.name == \"hew-web-$TAG.tar.gz\") | .id")"
          [ -z "$existing" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing"
          gh api --method POST \
            -H "Content-Type: application/gzip" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=hew-web-$TAG.tar.gz" \
            --input "hew-web-$TAG.tar.gz"

      # app.hew3d.com — direct upload so the deployed bits are exactly the
      # release build (RR11). Self-skips until the Cloudflare project +
      # secrets exist. `frame-ancestors` can't live in the injected <meta>
      # CSP, so it rides the host-level _headers file (see shells/web/README).
      - name: Deploy app.hew3d.com (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set — skipping the app.hew3d.com deploy."
            exit 0
          fi
          cp shells/web/_headers shells/web/dist/_headers
          npx wrangler@4 pages deploy shells/web/dist \
            --project-name=hew-app --branch=main --commit-dirty=true

  # The self-hostable relay: a static musl binary per Linux architecture,
  # each built NATIVELY (the arm64 leg on the arm64 runner, as the desktop
  # job's Linux arm64 leg already is) — no cross-linker to keep working.
  # Each tarball carries the binary, the systemd unit, and the crate README.
  relay:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: relay-${{ matrix.target }}

      # rustup honors rust-toolchain.toml for the compiler; the musl target
      # is added on top of that pinned toolchain.
      - name: musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.target }}

      - name: Build hew-relay (static)
        run: cargo build --release -p hew-relay --target ${{ matrix.target }}

      - name: Smoke the binary
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/hew-relay"
          file "$BIN" | grep -qi 'static' || { echo "::error::hew-relay is not statically linked"; file "$BIN"; exit 1; }
          "$BIN" --version
          "$BIN" --listen 127.0.0.1:18787 &
          sleep 1
          curl -sf http://127.0.0.1:18787/relay/ | grep -q '"service":"hew-relay"'
          kill %1

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          NAME="hew-relay-$TAG-${{ matrix.name }}.tar.gz"
          rm -rf stage && mkdir stage
          cp "target/${{ matrix.target }}/release/hew-relay" stage/
          cp shells/web/deploy/hew-relay.service stage/
          cp crates/hew-relay/README.md stage/README.md
          tar -czf "$NAME" -C stage .
          # Idempotent re-upload, same as the web tarball.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select(.name == \"$NAME\") | .id")"
          [ -z "$existing" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing"
          gh api --method POST \
            -H "Content-Type: application/gzip" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" \
            --input "$NAME"

  # ghcr.io/<owner>/hew-relay — a scratch image around the two static
  # binaries the relay job just uploaded (fetched back from the draft
  # release, so no artifact plumbing and no extra pinned action). Pushed
  # with GITHUB_TOKEN under this workflow's `packages: write`; the first
  # push creates the package PRIVATE — flip it to public once in the
  # package's settings for the docs' `docker pull` to work anonymously.
  relay-image:
    needs: [create-release, relay]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the relay binaries from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          fetch() { # <asset name> <platform dir>
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$1\") | .id")"
            [ -n "$id" ] || { echo "::error::release asset $1 missing"; exit 1; }
            mkdir -p "dist/$2"
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$1"
            tar -xzf "$1" -C "dist/$2" ./hew-relay
            chmod +x "dist/$2/hew-relay"
          }
          fetch "hew-relay-$TAG-linux-x86_64.tar.gz" linux/amd64
          fetch "hew-relay-$TAG-linux-aarch64.tar.gz" linux/arm64

      - name: Build and push the multi-arch image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hew-relay"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name hew-relay-builder
          # COPY-only Dockerfile: both platforms build without emulation.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file crates/hew-relay/Dockerfile \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --push \
            .

  # Assemble latest.json from the uploaded .sig assets. A single writer after
  # the whole matrix, so no read-modify-write races. URLs use the published
  # asset path (/releases/download/<tag>/…) — they resolve once the draft is
  # published; during the draft window the updater is tested against an
  # explicit endpoint override (RELEASE_PLANNING §14 step 9).
  updater-manifest:
    needs: [create-release, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.name, .id] | @tsv' > assets.tsv
          cat assets.tsv

          sig_for() { # sig_for <asset-name> → prints signature file content
            local id
            id="$(awk -F'\t' -v n="$1.sig" '$1 == n {print $2}' assets.tsv)"
            [ -n "$id" ] || { echo "::error::Missing $1.sig on the release." >&2; exit 1; }
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          }

          name_matching() { # name_matching <regex> → exactly one asset name
            local m
            m="$(cut -f1 assets.tsv | grep -E "$1" | grep -v '\.sig$' || true)"
            [ "$(echo "$m" | grep -c .)" -eq 1 ] || {
              echo "::error::Expected exactly one asset matching '$1', got: $m" >&2; exit 1; }
            echo "$m"
          }

          MAC=$(name_matching '\.app\.tar\.gz$')
          WIN_X64=$(name_matching 'x64.*-setup\.exe$')
          WIN_ARM=$(name_matching 'arm64.*-setup\.exe$')
          LIN_X64=$(name_matching '(amd64|x86_64).*\.AppImage$')
          LIN_ARM=$(name_matching '(arm64|aarch64).*\.AppImage$')

          url() { echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$1"; }

          # Bare assignments, NOT inline $(sig_for …) in the jq argument list:
          # an exit inside a command substitution used as one argument among
          # many is swallowed by bash, and a missing .sig would ship a
          # latest.json with a blank signature while the job reports green.
          MAC_SIG=$(sig_for "$MAC")
          WX_SIG=$(sig_for "$WIN_X64")
          WA_SIG=$(sig_for "$WIN_ARM")
          LX_SIG=$(sig_for "$LIN_X64")
          LA_SIG=$(sig_for "$LIN_ARM")

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$(url "$MAC")"         --arg mac_sig "$MAC_SIG" \
            --arg wx_url  "$(url "$WIN_X64")"     --arg wx_sig  "$WX_SIG" \
            --arg wa_url  "$(url "$WIN_ARM")"     --arg wa_sig  "$WA_SIG" \
            --arg lx_url  "$(url "$LIN_X64")"     --arg lx_sig  "$LX_SIG" \
            --arg la_url  "$(url "$LIN_ARM")"     --arg la_sig  "$LA_SIG" \
            '{
              version: $version,
              notes: "Hew \($version)",
              pub_date: $pub_date,
              platforms: {
                "darwin-x86_64":  { url: $mac_url, signature: $mac_sig },
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $wx_url,  signature: $wx_sig },
                "windows-aarch64":{ url: $wa_url,  signature: $wa_sig },
                "linux-x86_64":   { url: $lx_url,  signature: $lx_sig },
                "linux-aarch64":  { url: $la_url,  signature: $la_sig }
              }
            }' > latest.json

          jq . latest.json

          # Idempotent for the same reason as the web tarball: a re-run must
          # replace, not collide with, the latest.json it uploaded before.
          # assets.tsv predates this upload, so it holds any previous copy.
          existing="$(awk -F'\t' '$1 == "latest.json" {print $2}' assets.tsv)"
          [ -z "$existing" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing"
          gh api --method POST \
            -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            --input latest.json

  # Replace the placeholder body with a platform × architecture download
  # table once every asset is up. Asset names are constructed from the same
  # naming scheme the bundlers use and each one is checked against the real
  # asset list, so a bundler rename fails the job instead of shipping dead
  # links. A body that already contains a download table is left alone — a
  # re-run of this single job must not clobber hand-edited draft notes.
  # (Re-running the whole workflow still mints a fresh draft via
  # create-release; that is the pre-existing deal for every job here.)
  release-notes:
    needs: [create-release, desktop, web, relay]
    runs-on: ubuntu-latest
    steps:
      - name: Write the download table into the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          # The macOS bullet must not promise a signature the desktop job
          # only produces when the Apple secrets exist.
          APPLE_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          # Capture the body first: `gh | grep -q` under pipefail can report
          # SIGPIPE as failure on an early match, reading "table present" as
          # "table absent" — exactly the clobber this guard exists to stop.
          body="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body')"
          if grep -q '## Downloads' <<<"$body"; then
            echo "::notice::Body already carries a download table — leaving it untouched."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[].name' > assets.txt

          need() {
            grep -qxF "$1" assets.txt || {
              echo "::error::Expected release asset '$1' is missing." >&2; exit 1; }
          }

          MAC="Hew_${VERSION}_universal.dmg";        need "$MAC"
          WIN_X64="Hew_${VERSION}_x64-setup.exe";    need "$WIN_X64"
          WIN_ARM="Hew_${VERSION}_arm64-setup.exe";  need "$WIN_ARM"
          AI_X64="Hew_${VERSION}_amd64.AppImage";    need "$AI_X64"
          AI_ARM="Hew_${VERSION}_aarch64.AppImage";  need "$AI_ARM"
          DEB_X64="Hew_${VERSION}_amd64.deb";        need "$DEB_X64"
          DEB_ARM="Hew_${VERSION}_arm64.deb";        need "$DEB_ARM"
          RPM_X64="Hew-${VERSION}-1.x86_64.rpm";     need "$RPM_X64"
          RPM_ARM="Hew-${VERSION}-1.aarch64.rpm";    need "$RPM_ARM"
          WEB="hew-web-v${VERSION}.tar.gz";          need "$WEB"
          RELAY_X64="hew-relay-v${VERSION}-linux-x86_64.tar.gz";   need "$RELAY_X64"
          RELAY_ARM="hew-relay-v${VERSION}-linux-aarch64.tar.gz";  need "$RELAY_ARM"

          url() { echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$1"; }

          if [ "$APPLE_SIGNED" = "true" ]; then
            MAC_NOTE="The macOS disk image is signed and notarized; one universal app"
          else
            MAC_NOTE="One universal macOS app"
          fi

          cat > body.md <<EOF
          _Draft: replace this line with release highlights before publishing._

          ## Downloads

          The [download page](https://hew3d.com/download) picks the right build
          for your system, or grab a file directly:

          | Platform | x64 / Intel | ARM64 / Apple Silicon |
          | --- | --- | --- |
          | **macOS** — disk image | [universal .dmg][mac] | [universal .dmg][mac] |
          | **Windows** — installer | [.exe][win-x64] | [.exe][win-arm64] |
          | **Linux** — AppImage | [.AppImage][ai-x64] | [.AppImage][ai-arm64] |
          | **Linux** — Debian/Ubuntu | [.deb][deb-x64] | [.deb][deb-arm64] |
          | **Linux** — Fedora/openSUSE | [.rpm][rpm-x64] | [.rpm][rpm-arm64] |
          | **Web** — self-hosting tarball | [.tar.gz][web] | [.tar.gz][web] |
          | **Relay** — self-hosted Open on Phone (Linux) | [.tar.gz][relay-x64] | [.tar.gz][relay-arm64] |

          - $MAC_NOTE
            covers Apple Silicon and Intel.
          - Windows installers are not code-signed yet, so SmartScreen may
            warn on first run — choose **More info**, then **Run anyway**.
          - On Linux, mark the AppImage executable (\`chmod +x\`) before
            first run, or install the .deb/.rpm.
          - Desktop builds update themselves; \`latest.json\` and the
            \`.sig\` assets serve that built-in updater and are not meant
            for manual download.
          - Or skip installing entirely: Hew runs in the browser at
            [app.hew3d.com](https://app.hew3d.com).
          - Self-hosting the web app, and the optional relay that makes
            *Open on Phone* work against your own server, is documented in
            [docs/SELF_HOSTING.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/SELF_HOSTING.md).

          [mac]: $(url "$MAC")
          [win-x64]: $(url "$WIN_X64")
          [win-arm64]: $(url "$WIN_ARM")
          [ai-x64]: $(url "$AI_X64")
          [ai-arm64]: $(url "$AI_ARM")
          [deb-x64]: $(url "$DEB_X64")
          [deb-arm64]: $(url "$DEB_ARM")
          [rpm-x64]: $(url "$RPM_X64")
          [rpm-arm64]: $(url "$RPM_ARM")
          [web]: $(url "$WEB")
          [relay-x64]: $(url "$RELAY_X64")
          [relay-arm64]: $(url "$RELAY_ARM")
          EOF

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F body=@body.md > /dev/null
          echo "::notice::Download table written to the release body."
