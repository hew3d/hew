packages:
  - 'app'
  - 'shells/*'
  - 'site'
allowBuilds:
  # Edge/Firefox WebDriver managers pulled in transitively by WebdriverIO; the
  # desktop E2E drives the Tauri binary via tauri-driver + WebKitWebDriver,
  # so these browser drivers are never used — skip their postinstall downloads.
  edgedriver: false
  geckodriver: false
  esbuild: true
  # Astro's optional image encoder; the site uses passthroughImageService (all
  # images served verbatim from site/public/), so sharp's native build is dead
  # weight — skip it.
  sharp: false
minimumReleaseAgeExclude:
  - '@tauri-apps/api@2.11.1'
# Keep transitive pins on patched releases within their existing major.
# Major-only fixes (for example Mocha's serializer 6.x) need upstream changes.
overrides:
  'fast-uri@3': '^3.1.9'
  'ip-address@10': '^10.7.5'
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '^5.0.12'
  'undici@6': '^6.29.1'
  'undici@7': '^7.30.1'
  'undici@8': '^8.12.3'
  'serialize-javascript@7': '^7.1.4'
