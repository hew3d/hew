[package]
name = "wasm-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The live desktop transport's WASM half (docs/agents/HEW_API.md §11.2): the
# webview dispatches JSON-RPC frames straight against api::Connection, the
# same pure dispatcher hew-cli embeds headlessly. crates/api is
# kernel-class-pure (kernel, slotmap, serde only — DEVELOPMENT.md rule 1),
# so this is a safe addition at the WASM boundary where it belongs (§3).
api.workspace = true
# Plugin command declarations the app registers on the shared registry
# (docs/agents/PLUGINS.md "Commands"); pure, already in `api`'s tree.
plugin-manifest.workspace = true
kernel.workspace = true
inference.workspace = true
tessellate.workspace = true
mesh-export.workspace = true
softrender.workspace = true
# Hidden-line removal for vector Line-art prints and SVG export
# (docs/design/printing.md §7b) — pure geometry, same posture as softrender.
hlr.workspace = true
# The renderers behind hew.view.snapshot / hew.view.line_drawing, shared with
# hew-cli (pure over &Document; no new third-party dependency).
headless-render.workspace = true
# Hew-native PDF for Save PDF… (docs/design/printing.md §9b).
pdfwrite.workspace = true
dae-import.workspace = true
gltf-import.workspace = true
skp-import.workspace = true
skp-export.workspace = true
stl-import.workspace = true
image-import.workspace = true
slotmap.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# `LiveHost::library_write`'s content hash (docs/agents/HEW_API.md §8.1) —
# see the workspace-level `sha2` entry's doc comment. Pure Rust, no
# randomness, compiles cleanly for wasm32-unknown-unknown.
sha2.workspace = true
