[package]
name = "softrender"
version.workspace = true
edition.workspace = true
license.workspace = true

# The headless render device (docs/design/headless-snapshot.md): a pure
# software rasterizer over tessellate's renderer-agnostic buffers.
# Bytes in, bytes out — no GPU, no I/O, deterministic.
[dependencies]
kernel.workspace = true
tessellate.workspace = true
# Deflate for the PNG writer; kept on the same line as pdfwrite and hew-cli.
# softrender is not one of the three kernel crates.
miniz_oxide = "0.9.0"
png = { workspace = true }
jpeg-decoder = { workspace = true }
