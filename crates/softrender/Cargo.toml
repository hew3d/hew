[package]
name = "softrender"
version.workspace = true
edition.workspace = true
license.workspace = true

# The headless render device (docs/design/headless-snapshot.md): a pure
# software rasterizer over tessellate's renderer-agnostic buffers.
# Bytes in, bytes out — no GPU, no I/O, deterministic.
[dependencies]
kernel.workspace = true
tessellate.workspace = true
# Deflate for the PNG writer. Pinned to the version the `png` crate already
# resolves to in the lock; softrender is not one of the three kernel crates.
miniz_oxide = "0.8.9"
