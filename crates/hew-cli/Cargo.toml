[package]
name = "hew-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Standalone binary: MCP adapter, script runner, one-shot dispatch
# (docs/agents/HEW_API.md §12). Headless — embeds `api` + the kernel + the
# importer crates directly; no UI process anywhere. Not a workspace
# dependency of anything else (nothing links a binary crate).
[[bin]]
name = "hew-cli"
path = "src/main.rs"

[dependencies]
api = { workspace = true }
kernel = { workspace = true }
tessellate = { workspace = true }
softrender = { workspace = true }
# Headless printing (docs/design/printing.md §9b): hidden-line drawings and
# the PDF writer behind hew.view.line_drawing / hew.print.pdf.
hlr = { workspace = true }
headless-render = { workspace = true }
pdfwrite = { workspace = true }
mesh-export = { workspace = true }
stl-import = { workspace = true }
image-import = { workspace = true }
gltf-import = { workspace = true }
dae-import = { workspace = true }
skp-import = { workspace = true }
skp-export = { workspace = true }
# The Hew Library's on-disk layout (docs/agents/HEW_API.md §8.1;
# docs/design/v1.1-cycle.md's Lane B): folder resolution, file naming, and
# atomic list/read/write/remove, shared with the Tauri shell.
library = { workspace = true }
serde_json = { workspace = true }
# OS randomness for minting a document id on save (HEW_FILE_FORMAT.md §2
# `document_id`): the same version `hew-relay` already uses, so the lock
# gains no new crate.
getrandom = "0.3"

# Windows named-pipe transport for `--live` (docs/agents/HEW_API.md §11.2, §12):
# CreateFileW/ReadFile/WriteFile/WaitNamedPipeW/OpenProcess, all synchronous
# — the client stays plain std::thread like its unix counterpart, no async
# runtime. Target-gated so macOS/Linux builds gain nothing; see
# src/live.rs's module doc for why windows-sys (not tokio) was chosen.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    # CreateFileW's signature references SECURITY_ATTRIBUTES even though
    # this client always passes null for it.
    "Win32_Security",
] }

[dev-dependencies]
# Plugin command declarations for the MCP provider-labeling tests.
plugin-manifest = { workspace = true }
# Inflates a snapshot PNG so the stability pin hashes pixels, not the
# encoder's compressed bytes. The version softrender already pins.
miniz_oxide = "0.8.9"
