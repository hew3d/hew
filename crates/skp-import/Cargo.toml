# skp-import — SketchUp `.skp` -> Hew Objects, via the clean-room Skpwright reader.
#
# The `skpwright` dependency is a crates.io semver pin on the hosted Skpwright
# releases (https://github.com/hew3d/skpwright — clean-room reader for the
# SketchUp 2026 container and the 2017 format; local development clone
# lives at ../skpwright). Bump the pin
# deliberately: import-quality gaps are fixed in Skpwright first, then the pin
# advances here.
[package]
name = "skp-import"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernel = { workspace = true }
mesh-heal = { workspace = true }
skpwright = "0.6.0"
# JSON text Hew stores for an attribute value SketchUp has no type for.
serde_json = { workspace = true }

[dev-dependencies]
proptest.workspace = true
tessellate = { workspace = true }
# Differential validation: fixture pairs ship a `.dae` ground-truth
# export next to each `.skp`; both importers must agree.
dae-import = { workspace = true }
