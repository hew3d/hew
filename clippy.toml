# Determinism guard (docs/dev/DEVELOPMENT.md, Road to Reliable).
#
# Ban the iteration-order-dependent collections in the kernel crates. The
# "worked twice, failed the third time" flakiness class is rooted in HashMap /
# HashSet iteration order (already seen once as the seed-dependent split_face
# dangling-`outgoing` crash). Offenders migrate to BTreeMap / BTreeSet
# (sorted, zero new dep — the default) or IndexMap / IndexSet (insertion-order;
# none needed so far).
#
# clippy.toml is resolved once per `cargo clippy --workspace` invocation, so this
# applies to ALL workspace members, not just the four determinism-critical kernel
# crates (kernel / inference / tessellate / mesh-heal). The crates outside that
# scope — wasm-api (the WASM boundary), dae-import, gltf-import — carry a justified
# crate-root `#![allow(clippy::disallowed_types)]`; so do the kernel integration
# test files, whose set use is order-independent equality assertions.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is nondeterministic; use BTreeMap (sorted) or IndexMap (insertion-order) in kernel crates for bit-for-bit determinism. Outside the four kernel crates, suppress with a justified crate-root #![allow(clippy::disallowed_types)]." },
    { path = "std::collections::HashSet", reason = "iteration order is nondeterministic; use BTreeSet (sorted) or IndexSet (insertion-order) in kernel crates for bit-for-bit determinism. Outside the four kernel crates, suppress with a justified crate-root #![allow(clippy::disallowed_types)]." },
]

# Determinism guard, part two: transcendental float math.
#
# IEEE 754 makes + - * / and sqrt exact, but not sin, cos, atan2, exp, ln and
# the rest: each C math library rounds them its own way. std's f64::sin calls
# the platform's library on a native build (glibc on Linux, Apple's on macOS)
# and the pure-Rust libm code compiled into compiler_builtins on wasm32, and
# those disagree in the last bit on a few percent of inputs, enough to move a
# vertex and so a document's state hash. The kernel crates therefore call
# `kernel::trig`, one pure-Rust implementation (the pinned `libm` crate) on
# every target. The methods below are banned workspace-wide; the crates
# outside the kernel whose use never reaches document geometry carry a
# justified crate-root `#![allow(clippy::disallowed_methods)]`, as for the
# collections above (one test function that only formats a number carries an
# item-level one).
disallowed-methods = [
    { path = "f64::sin", reason = "not correctly rounded, and std computes it with the platform's C math library natively but a pure-Rust one in WASM, so the last bit differs by platform; kernel crates call kernel::trig. Outside the four kernel crates, a site whose result never reaches the document suppresses this with a justified #![allow(clippy::disallowed_methods)]." },
    { path = "f64::cos", reason = "not correctly rounded, and std computes it with the platform's C math library natively but a pure-Rust one in WASM, so the last bit differs by platform; kernel crates call kernel::trig. Outside the four kernel crates, a site whose result never reaches the document suppresses this with a justified #![allow(clippy::disallowed_methods)]." },
