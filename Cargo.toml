[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/softrender",
    "crates/hlr",
    "crates/pdfwrite",
    "crates/kernel",
    "crates/inference",
    "crates/tessellate",
    "crates/wasm-api",
    "crates/mesh-heal",
    "crates/mesh-export",
    "crates/dae-import",
    "crates/gltf-import",
    "crates/skp-import",
    "crates/skp-export",
    "crates/stl-import",
    "crates/library",
    "crates/hew-cli",
    "crates/hew-relay",
]
# The Tauri host crate is deliberately NOT a workspace member: it drags
# desktop-only dependencies into `cargo test --workspace` and would slow the
# kernel verification loop. It builds via `pnpm tauri` from shells/tauri.
#
# The vendored dae-parser is likewise excluded: it is third-party code (built via
# dae-import's path dep) and must not be held to Hew's `clippy -D warnings` bar.
exclude = [
    "shells/tauri/src-tauri",
    "crates/vendor/dae-parser",
    "crates/vendor/minidom-14",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
# AGPL-3.0-only plus an additional permission for closed-source plugins that
# use only the documented Plugin API — see LICENSE and LICENSE-EXCEPTION.
license = "AGPL-3.0-only"

[workspace.dependencies]
api = { path = "crates/api" }
softrender = { path = "crates/softrender" }
hlr = { path = "crates/hlr" }
pdfwrite = { path = "crates/pdfwrite" }
kernel = { path = "crates/kernel" }
inference = { path = "crates/inference" }
tessellate = { path = "crates/tessellate" }
mesh-heal = { path = "crates/mesh-heal" }
mesh-export = { path = "crates/mesh-export" }
dae-import = { path = "crates/dae-import" }
gltf-import = { path = "crates/gltf-import" }
skp-import = { path = "crates/skp-import" }
skp-export = { path = "crates/skp-export" }
stl-import = { path = "crates/stl-import" }
library = { path = "crates/library" }
# Clean-room SketchUp .skp reader (the 2026 container and the 2017 format):
# a crates.io semver pin on the hosted OpenSKP releases, so CI resolves it
# like any other dependency. No Trimble SDK material anywhere in its chain
# (rule 7 admissibility test). Local dev clone: ../openskp.
openskp = "0.5.0"

slotmap = "1"
proptest = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "9", default-features = false }
# Library item content hashing (docs/agents/HEW_API.md §8.1's
# `LibraryProvenance.content_hash`): `crates/library` (the headless/desktop
# hosts) and `crates/wasm-api` (`LiveHost::library_write`, which computes the
# hash itself since it has no filesystem to defer the write to) both need
# the identical SHA-256, so it's pinned once here.
sha2 = "0.10"
# Structured diagnostic logging (docs/dev/DEVELOPMENT.md, M14). kernel/inference use only
# the `tracing` facade (events, no I/O); wasm-api owns the Subscriber + the
# wasm→shell drain seam. default-features=false drops the `#[instrument]` proc
# macro we don't use, keeping the WASM bundle lean.
tracing = { version = "0.1", default-features = false, features = ["std"] }
dae-parser = { path = "crates/vendor/dae-parser" }
# Texture image decoding in skp-export: a textured material's average color
# (what SketchUp draws with textures off) comes from its image. Pure Rust,
# no default features, so the WASM bundle takes only the decoders.
png = { version = "0.18", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
# WASM payload size matters for the web shell.
opt-level = "s"
lto = true
